[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.isort]
# Task modules are declared here so import sorting does not depend on whether the
# module file exists yet (it does not during the red step). Add each task's module here.
known-first-party = ["stream_merge"]